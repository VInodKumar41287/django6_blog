<header class="p-3 bg-dark text-white">
    <div class="row">
        <div class="col">
            <a class="text-light text-decoration-none" href="/">
                <h3>{{ head_title | default:"Blog" }}</h3>
            </a>
        </div>
        <div class="col">
            <div class="d-flex justify-content-center gap-3">
                <a class="text-light text-decoration-none" href="/blog">Home</a>
                <a class="text-light text-decoration-none" href="/blog/about">About</a>
                <a class="text-light text-decoration-none" href="/blog/contact">Contact</a>
                {% if user.is_authenticated %}
                <a class="text-light text-decoration-none" href="/dashboard">Dashboard</a>
                <a class="text-light text-decoration-none" href="/logout">Logout</a>
                {% else %}
                <a class="text-light text-decoration-none" href="/register">Register</a>
                <a class="text-light text-decoration-none" href="/login">Login</a>
                {% endif %}
            </div>
        </div>
    </div>
</header>
